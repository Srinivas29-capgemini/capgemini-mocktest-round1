<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Capgemini Round 1 Teacher</title><style>
body{font-family:Arial;background:#f4f7fb;margin:0;color:#172033}header{background:#132b4f;color:#fff;padding:20px;font-size:22px}main{max-width:1100px;margin:25px auto;padding:15px}.card{background:#fff;padding:22px;margin:18px 0;border-radius:14px;box-shadow:0 4px 15px #0001}input,button{padding:11px;border-radius:8px;border:1px solid #ccd5e0}button{background:#1769e0;color:#fff;border:0;font-weight:bold;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.hidden{display:none}.code{font-size:26px;font-weight:bold;letter-spacing:4px}.students{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.student{border:1px solid #ddd;border-radius:10px;padding:12px}.student img{width:100%;background:#111;border-radius:8px}.badge{padding:4px 7px;border-radius:20px;background:#eee;display:inline-block;margin:3px}.good{background:#dff7e8}.bad{background:#ffe1e1}</style></head><body><header>Capgemini Round 1 — Teacher Dashboard</header>
<div id="login" class="card" style="max-width:400px;margin:70px auto"><h2>Teacher Login</h2><input id="u" placeholder="Username" style="width:100%;box-sizing:border-box;margin:5px 0"><input id="p" type="password" placeholder="Password" style="width:100%;box-sizing:border-box;margin:5px 0"><button onclick="login()" style="width:100%">Login</button><p id="lm"></p></div>
<main id="app" class="hidden"><div class="card"><h2>Create Exam</h2><div class="row"><label>Title<br><input id="title" value="Capgemini Round 1 Demo"></label><label>Minutes<br><input id="dur" type="number" value="120"></label><button onclick="createExam()">Create Exam</button></div><p id="cm"></p></div><div class="card"><h2>Exams</h2><div id="exams">No exams yet.</div></div><div class="card"><h2>Live Students / Webcam</h2><div id="students" class="students">No active students.</div></div></main>
<script src="/socket.io/socket.io.js"></script><script>
async function login(){let r=await fetch("/api/teacher/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})}),d=await r.json();if(!r.ok){lm.textContent=d.error;return}document.getElementById("login").classList.add("hidden");app.classList.remove("hidden");io().on("student-update",loadStudents);loadExams();loadStudents()}
async function createExam(){let r=await fetch("/api/exams",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:title.value,duration:+dur.value})}),d=await r.json();if(!r.ok){cm.textContent=d.error;return}cm.innerHTML="Exam created. Code: <span class=code>"+d.exam.code+"</span>";loadExams()}
async function loadExams(){let r=await fetch("/api/exams");if(!r.ok)return;let a=await r.json();exams.innerHTML=a.length?a.map(e=>`<div class=card><b>${e.title}</b><br>Code: <span class=code>${e.code}</span><br>${e.duration} minutes · ${e.questionCount} MCQs · ${e.active?"ACTIVE":"NOT STARTED"}<br><br>${e.active?`<button onclick="stop('${e.code}')">Stop</button>`:`<button onclick="start('${e.code}')">Start Exam</button>`} <button onclick="copy('${e.code}')">Copy Student Link</button></div>`).join(""):"No exams yet."}
async function start(c){await fetch("/api/exams/"+c+"/start",{method:"POST"});loadExams()}async function stop(c){await fetch("/api/exams/"+c+"/stop",{method:"POST"});loadExams()}function copy(c){let x=location.origin+"/student?code="+c;navigator.clipboard.writeText(x);alert("Student link copied:\\n"+x+"\\nExam code: "+c)}
async function loadStudents(){let r=await fetch("/api/teacher/students");if(!r.ok)return;let a=await r.json();students.innerHTML=a.length?a.map(s=>`<div class=student>${s.lastSnapshot?`<img src="${s.lastSnapshot}">`:`<div style="height:180px;background:#111;color:#fff;display:grid;place-items:center">Waiting for webcam…</div>`}<h3>${esc(s.name)}</h3><span class="badge ${s.camera?"good":"bad"}">Camera ${s.camera?"ON":"OFF"}</span><span class="badge ${s.microphone?"good":"bad"}">Mic ${s.microphone?"ON":"OFF"}</span><span class="badge">${s.submitted?"Submitted":"Writing"}</span>${s.score!==null?"<p>Score: "+s.score+"</p>":""}</div>`).join(""):"No active students."}function esc(x){return x.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
</script></body></html>
