<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Capgemini Round 1 Student</title><style>
body{font-family:Arial;background:#f4f7fb;margin:0;color:#172033}header{background:#132b4f;color:#fff;padding:20px;font-size:22px}main{max-width:900px;margin:25px auto;padding:15px}.card{background:#fff;padding:22px;margin:18px 0;border-radius:14px;box-shadow:0 4px 15px #0001}input,button{padding:12px;border-radius:8px;border:1px solid #ccd5e0}button{background:#1769e0;color:#fff;border:0;font-weight:bold;cursor:pointer}.hidden{display:none}.timer{position:sticky;top:0;background:#fff;padding:12px;font-size:25px;font-weight:bold;z-index:5}.q{border:1px solid #ddd;border-radius:10px;padding:15px;margin:12px 0}.q label{display:block;padding:8px}video{width:300px;border-radius:10px;background:#111}</style></head><body><header>Capgemini Round 1 Mock Test</header><main>
<div id="join" class="card"><h2>Join Exam</h2><input id="name" placeholder="Student name" style="width:100%;box-sizing:border-box;margin:5px 0"><input id="code" placeholder="Exam code" style="width:100%;box-sizing:border-box;margin:5px 0"><button onclick="join()">Join</button><p id="msg"></p></div>
<div id="perm" class="card hidden"><h2>Camera & Microphone Check</h2><p>Allow camera and microphone access.</p><video id="vid" autoplay muted playsinline></video><br><button onclick="begin()">Start Test</button><p id="pm"></p></div>
<div id="exam" class="hidden"><div class="timer">Time remaining: <span id="t">--:--</span></div><div class="card"><h2 id="et"></h2><p id="ei"></p><div id="qs"></div><button onclick="submitTest()" style="width:100%">Submit Exam</button></div></div>
<div id="done" class="card hidden"><h2>Exam Submitted</h2><p id="result"></p></div></main>
<script>
let sid,data,stream,interval,seconds,submitted=false;let c=new URLSearchParams(location.search).get("code");if(c)code.value=c.toUpperCase();
async function join(){let r=await fetch("/api/student/join",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,code:code.value.toUpperCase()})}),d=await r.json();if(!r.ok){msg.textContent=d.error;return}sid=d.studentId;let x=await fetch("/api/student/exam/"+d.code);data=await x.json();join.classList.add("hidden");perm.classList.remove("hidden");try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});vid.srcObject=stream;await status(true,true);pm.textContent="Camera and microphone ready."}catch(e){pm.textContent="Please allow camera and microphone.";await status(false,false)}}
async function status(camera,microphone){await fetch("/api/student/status",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({studentId:sid,camera,microphone})})}
function begin(){if(!stream)return alert("Allow camera and microphone first.");perm.classList.add("hidden");exam.classList.remove("hidden");et.textContent=data.title;ei.textContent=data.questions.length+" MCQs · "+data.duration+" minutes";qs.innerHTML=data.questions.map((q,i)=>`<div class=q><b>${i+1}. ${esc(q.q)}</b>${q.o.map((o,j)=>`<label><input type=radio name=q${i} value=${j}> ${esc(o)}</label>`).join("")}</div>`).join("");seconds=data.duration*60;tick();interval=setInterval(tick,1000);setInterval(snapshot,2500)}
function tick(){let m=Math.floor(seconds/60),s=seconds%60;t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(seconds--<=0)submitTest()}
async function snapshot(){if(!stream||!sid)return;let canvas=document.createElement("canvas");canvas.width=560;canvas.height=350;canvas.getContext("2d").drawImage(vid,0,0,560,350);await fetch("/api/student/snapshot",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({studentId:sid,image:canvas.toDataURL("image/jpeg",.55)})})}
async function submitTest(){if(submitted)return;submitted=true;clearInterval(interval);let a=data.questions.map((_,i)=>{let x=document.querySelector("input[name=q"+i+"]:checked");return x?+x.value:-1});let r=await fetch("/api/student/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({studentId:sid,answers:a})}),d=await r.json();if(stream)stream.getTracks().forEach(x=>x.stop());exam.classList.add("hidden");done.classList.remove("hidden");result.textContent="Your score: "+d.score+" / "+d.total}
function esc(x){return x.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
</script></body></html>
